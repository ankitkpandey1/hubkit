name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install pytest ruff==0.16.8 mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy scripts/hubcore scripts/learn.py scripts/hubkit
      - name: Tests
        run: python -m pytest tests -q
