name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install ruff==0.16.8 mypy
      - name: Lint
        run: ruff check .
      - name: Type check on every platform
        run: |
          mypy --platform linux scripts/hubcore scripts/learn.py scripts/hubkit
          mypy --platform darwin scripts/hubcore scripts/learn.py scripts/hubkit
          mypy --platform win32 scripts/hubcore scripts/learn.py scripts/hubkit

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest tests -q -rs
